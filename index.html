<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaditya Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{
    --bg:#F3EEE2;
    --bg-raised:#EAE3D2;
    --paper:#2E2A20;
    --paper-dim:#8A8270;
    --ink:#6E5A3E;
    --ink-dim:#A8957A;
    --rust:#A8492C;
    --line:#DCD4BF;
    --dot:#D2C8B0;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--paper);font-family:var(--font-body);overflow:hidden;height:100%;}
  a{color:inherit;}
  ::selection{background:var(--ink);color:var(--bg);}

  #app{position:relative;width:100vw;height:100vh;overflow:hidden;}

  /* ---------- HEADER ---------- */
  header{
    position:absolute; top:0; left:0; right:0; z-index:30;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:28px 36px; pointer-events:none;
  }
  .wordmark{
    font-family:var(--font-display); font-weight:500; font-size:22px;
    letter-spacing:0.01em; pointer-events:auto;
  }
  .wordmark span{color:var(--ink); font-style:italic; font-weight:400;}
  .thesis{
    max-width:280px; text-align:right; font-size:12px; line-height:1.6;
    color:var(--paper-dim); font-family:var(--font-mono); letter-spacing:0.01em;
    pointer-events:auto;
  }

  /* ---------- BREADCRUMB / BACK ---------- */
  #breadcrumb{
    position:absolute; top:28px; left:50%; transform:translateX(-50%);
    z-index:50; display:flex; gap:10px; align-items:center;
    font-family:var(--font-mono); font-size:12px; color:var(--paper-dim);
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #breadcrumb.show{opacity:1; pointer-events:auto;}
  #breadcrumb .crumb{cursor:pointer; padding:4px 8px; border:1px solid transparent;}
  #breadcrumb .crumb:hover{color:var(--paper); border-color:var(--line);}
  #breadcrumb .crumb.current{color:var(--ink);}
  #breadcrumb .sep{color:var(--line);}

  /* ---------- MAP STAGE ---------- */
  #stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  }
  #mapViewport{
    width:100%; height:100%; position:relative; overflow:hidden;
  }
  #mapSvg{
    width:100%; height:100%; display:block;
    transform-origin:0 0;
    transition:transform 0.9s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .country-path{cursor:pointer; stroke:var(--line); stroke-width:0.6; transition:filter .2s, stroke .25s; vector-effect:non-scaling-stroke;}
  .country-path.active{stroke:var(--ink-dim);}
  .country-path.active:hover{stroke:var(--ink); filter:brightness(0.94) saturate(1.15);}
  .country-path.inactive{fill:url(#dotPatternDim); stroke:var(--line); cursor:default;}
  .ocean{fill:var(--bg);}
  .pin{cursor:pointer;}
  .pin circle.ring{fill:none; stroke:var(--ink); stroke-width:1; opacity:0; transition:opacity .25s, r .25s;}
  .pin circle.core{fill:var(--ink); transition:fill .2s, r .2s;}
  .pin.sub circle.core{fill:var(--rust);}
  .pin:hover circle.ring{opacity:0.55; r:13;}
  .pin:hover circle.core{r:4.5;}
  .pin-label{
    font-family:var(--font-mono); font-size:9.5px; fill:var(--paper-dim);
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .pin:hover .pin-label{opacity:1; fill:var(--paper);}

  /* ---------- APERTURE TRANSITION ---------- */
  #iris{
    position:absolute; inset:0; z-index:25; pointer-events:none;
    background:var(--bg);
    clip-path:circle(0% at 50% 50%);
  }
  #iris.firing{
    animation:irisOpen 0.9s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes irisOpen{
    0%{clip-path:circle(0% at var(--ix,50%) var(--iy,50%));}
    45%{clip-path:circle(75% at var(--ix,50%) var(--iy,50%));}
    100%{clip-path:circle(0% at var(--ix,50%) var(--iy,50%));}
  }

  /* ---------- COORD READOUT ---------- */
  #coords{
    position:absolute; bottom:28px; left:36px; z-index:30;
    font-family:var(--font-mono); font-size:11px; color:var(--paper-dim);
    letter-spacing:0.02em;
  }
  #hint{
    position:absolute; bottom:28px; right:36px; z-index:30;
    font-family:var(--font-mono); font-size:11px; color:var(--paper-dim);
    text-align:right; max-width:240px; line-height:1.6;
  }

  /* ---------- GALLERY VIEW ---------- */
  #galleryView{
    position:absolute; inset:0; z-index:40; background:var(--bg);
    overflow-y:auto; padding:120px 36px 80px; display:none;
  }
  #galleryView.show{display:block;}
  .gallery-head{max-width:900px; margin:0 auto 40px;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font-family:var(--font-mono); font-size:12px; color:var(--paper-dim);
    margin-bottom:18px; transition:color .2s;
  }
  .back-link:hover{color:var(--ink);}
  .gallery-head h1{
    font-family:var(--font-display); font-weight:500; font-size:42px; margin:0 0 6px;
  }
  .gallery-head .meta{
    font-family:var(--font-mono); font-size:12px; color:var(--ink); letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .gallery-grid{
    max-width:1100px; margin:0 auto; display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:18px;
  }
  .gallery-grid figure{
    margin:0; cursor:pointer; position:relative; overflow:hidden; background:var(--bg-raised);
  }
  .gallery-grid img{width:100%; display:block; aspect-ratio:4/5; object-fit:cover; transition:transform .5s; filter:grayscale(0.1) contrast(1.05);}
  .gallery-grid figure:hover img{transform:scale(1.04);}
  .gallery-grid figcaption{
    position:absolute; bottom:0; left:0; right:0; padding:14px;
    font-family:var(--font-mono); font-size:11px; color:var(--paper);
    background:linear-gradient(transparent, rgba(0,0,0,.65));
  }

  /* ---------- LIGHTBOX ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:90; background:rgba(10,10,8,.94);
    display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  #lightbox.show{display:flex;}
  #lightbox img{max-width:88vw; max-height:78vh; object-fit:contain;}
  #lightbox .lb-cap{font-family:var(--font-mono); font-size:12px; color:var(--paper-dim); margin-top:16px;}
  #lightbox .lb-close{position:absolute; top:28px; right:36px; font-family:var(--font-mono); font-size:12px; cursor:pointer; color:var(--paper-dim);}
  #lightbox .lb-close:hover{color:var(--paper);}

  @media (max-width:640px){
    .thesis{display:none;}
    .gallery-head h1{font-size:30px;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="wordmark">Aaditya's <span>Atlas</span></div>
    <div class="thesis">a photographic record of aadi's "canon rebel" journey.</div>
  </header>

  <div id="breadcrumb">
    <span class="crumb" data-go="world">world</span>
  </div>

  <div id="stage">
    <div id="mapViewport">
      <svg id="mapSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
  </div>

  <div id="iris"></div>

  <div id="coords">LAT — / LNG —</div>
  <div id="hint">hover a marker to preview · click to descend</div>

  <div id="galleryView">
    <div class="gallery-head">
      <div class="back-link" id="galleryBack">← back to map</div>
      <div class="meta" id="galleryMeta">region</div>
      <h1 id="galleryTitle">Title</h1>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <div id="lightbox">
    <span class="lb-close" id="lbClose">close ✕</span>
    <img id="lbImg" src="" alt="">
    <div class="lb-cap" id="lbCap"></div>
  </div>
</div>

<script>
/* ============== DATA ==============

*/

  },

    regions:[
      { id:'switzerland-all', name:'Zurich & the Alps', lat:46.7, lng:8.1,
        photos:[
          {src:'https://picsum.photos/seed/zurich1/900/1100', cap:'Replace with your own image — caption here'},

        photos:[
          {src:'https://picsum.photos/seed/tokyo1/900/1100', cap:'Replace with your own image — caption here'},

    regions:[
      { id:'puerto-rico-all', name:'San Juan & El Yunque', lat:18.4, lng:-65.95,
        photos:[
          {src:'https://picsum.photos/seed/sanjuan1/900/1100', cap:'Replace with your own image — caption here'},

          {src:'https://picsum.photos/seed/sanjuan4/900/1100', cap:'Replace with your own image — caption here'},
          {src:'https://picsum.photos/seed/yunque1/900/1100', cap:'Replace with your own image — caption here'},
          {src:'https://picsum.photos/seed/yunque2/900/1100', cap:'Replace with your own image — caption here'},
          {src:'https://picsum.photos/seed/yunque3/900/1100', cap:'Replace with your own image — caption here'},
          {src:'https://picsum.photos/seed/yunque4/900/1100', cap:'Replace with your own image — caption here'},
        ]},
    ]

/* ============== HELPERS ============== */
const $ = sel => document.querySelector(sel);
const svgNS = 'http://www.w3.org/2000/svg';
const mapSvg = $('#mapSvg');
const viewport = $('#mapViewport');
const iris = $('#iris');
const breadcrumb = $('#breadcrumb');

function project(lat,lng){ return PROJ([lng,lat]) ? {x:PROJ([lng,lat])[0], y:PROJ([lng,lat])[1]} : {x:0,y:0}; }

/* shared patterns: dim (countries with no data yet) + ocean texture.
   Active countries get their own pastel-tinted pattern, built per-country below. */
function buildDotPatterns(){
  const defs = document.createElementNS(svgNS,'defs');
  const specs = [
    {id:'dotPatternDim', color:'var(--dot)', size:14, r:1.0},
    {id:'dotPatternOcean', color:'var(--dot)', size:20, r:0.7},
  ];
  specs.forEach(s=>{
    const pattern = document.createElementNS(svgNS,'pattern');
    pattern.setAttribute('id',s.id);
    pattern.setAttribute('width',s.size); pattern.setAttribute('height',s.size);
    pattern.setAttribute('patternUnits','userSpaceOnUse');
    const c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx',s.size/6); c.setAttribute('cy',s.size/6); c.setAttribute('r',s.r);
    c.setAttribute('fill',s.color);
    pattern.appendChild(c);
    defs.appendChild(pattern);
  });
  mapSvg.appendChild(defs);

  const oceanRect = document.createElementNS(svgNS,'rect');
  oceanRect.setAttribute('class','ocean');
  oceanRect.setAttribute('x','0'); oceanRect.setAttribute('y','0');
  oceanRect.setAttribute('width','1000'); oceanRect.setAttribute('height','500');
  mapSvg.appendChild(oceanRect);
  const oceanDots = document.createElementNS(svgNS,'rect');
  oceanDots.setAttribute('x','0'); oceanDots.setAttribute('y','0');
  oceanDots.setAttribute('width','1000'); oceanDots.setAttribute('height','500');
  oceanDots.setAttribute('fill','url(#dotPatternOcean)');
  mapSvg.appendChild(oceanDots);
}

/* builds one densely-dotted pastel pattern per active country, so the
   country reads as "illuminated" in its color while still carrying the
   dot-grid texture rather than a flat wash. */
function buildCountryPattern(defs, country){
  const pattern = document.createElementNS(svgNS,'pattern');
  pattern.setAttribute('id', `dot-${country.id}`);
  pattern.setAttribute('width','9'); pattern.setAttribute('height','9');
  pattern.setAttribute('patternUnits','userSpaceOnUse');
  const c = document.createElementNS(svgNS,'circle');
  c.setAttribute('cx','3'); c.setAttribute('cy','3'); c.setAttribute('r','3.3');
  c.setAttribute('fill', country.color);
  pattern.appendChild(c);
  defs.appendChild(pattern);
}

let PROJ = null;
const countryLayer = document.createElementNS(svgNS,'g');
countryLayer.setAttribute('id','countryLayer');

async function loadWorldGeometry(){
  const topoUrl = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
  const topo = await fetch(topoUrl).then(r=>r.json());
  const geo = topojson.feature(topo, topo.objects.countries);
  PROJ = d3.geoNaturalEarth1().fitSize([1000,500], geo);
  const path = d3.geoPath().projection(PROJ);
  const activeIsoSet = new Set(WORLD.map(c=>c.iso));

  geo.features.forEach(feature=>{
    const iso = +feature.id;
    const p = document.createElementNS(svgNS,'path');
    p.setAttribute('d', path(feature));
    const isActive = activeIsoSet.has(iso);
    p.setAttribute('class', 'country-path ' + (isActive?'active':'inactive'));
    if(isActive){
      const country = WORLD.find(c=>c.iso===iso);
      buildCountryPattern(mapSvg.querySelector('defs'), country);
      p.style.fill = `url(#dot-${country.id})`;
      p.addEventListener('click', (e)=> showCountry(country.id, p));
    }
    countryLayer.appendChild(p);
  });
  mapSvg.appendChild(countryLayer);
}

const pinsLayer = document.createElementNS(svgNS,'g');
pinsLayer.setAttribute('id','pinsLayer');

function clearPins(){ pinsLayer.innerHTML=''; }

function drawPin({x,y,name,sub,onClick,counterScale=1}){
  const g = document.createElementNS(svgNS,'g');
  g.setAttribute('class','pin'+(sub?' sub':''));
  g.setAttribute('transform',`translate(${x},${y})`);

  /* inner group cancels out the parent map's zoom scale, so the pin and its
     label always render at the same visual size on screen, no matter how
     far the map is zoomed in. */
  const inner = document.createElementNS(svgNS,'g');
  inner.setAttribute('transform', `scale(${1/counterScale})`);

  const ring = document.createElementNS(svgNS,'circle');
  ring.setAttribute('class','ring'); ring.setAttribute('r','9');
  const core = document.createElementNS(svgNS,'circle');
  core.setAttribute('class','core'); core.setAttribute('r','3');

  const label = document.createElementNS(svgNS,'text');
  label.setAttribute('class','pin-label');
  label.setAttribute('x','10'); label.setAttribute('y','4');
  label.textContent = name;

  inner.appendChild(ring); inner.appendChild(core); inner.appendChild(label);
  g.appendChild(inner);
  g.addEventListener('click', (e)=>{ e.stopPropagation(); onClick(g); });
  pinsLayer.appendChild(g);
}

/* ============== STATE / VIEWS ============== */
let state = { view:'world', countryId:null, regionId:null };

function setIrisOriginFromEvent(el){
  const rect = el.getBoundingClientRect();
  const cx = ((rect.left+rect.width/2)/window.innerWidth*100).toFixed(1)+'%';
  const cy = ((rect.top+rect.height/2)/window.innerHeight*100).toFixed(1)+'%';
  iris.style.setProperty('--ix',cx);
  iris.style.setProperty('--iy',cy);
}
function fireIris(){
  iris.classList.remove('firing');
  void iris.offsetWidth;
  iris.classList.add('firing');
}

function zoomTo(lat,lng,scale){
  const rectBox = viewport.getBoundingClientRect();
  const W = 1000, H = 500; // viewBox units == css px since svg is block at viewport size scaled by viewBox mapping... use viewport css size
  // svg renders at viewport.clientWidth x clientHeight; viewBox stretches 1000x500 to fill that.
  const cssW = viewport.clientWidth, cssH = viewport.clientHeight;
  const p = project(lat,lng);
  // convert viewBox coords to css px (pre-transform)
  const X = p.x/1000*cssW, Y = p.y/500*cssH;
  const tx = (cssW/2)/scale - X;
  const ty = (cssH/2)/scale - Y;
  mapSvg.style.transform = `scale(${scale}) translate(${tx}px, ${ty}px)`;
}
function zoomReset(){
  mapSvg.style.transform = 'scale(1) translate(0px,0px)';
}

function renderBreadcrumb(){
  let html = `<span class="crumb ${state.view==='world'?'current':''}" data-go="world">world</span>`;
  if(state.countryId){
    const c = WORLD.find(c=>c.id===state.countryId);
    html += `<span class="sep">/</span><span class="crumb ${state.view==='country'?'current':''}" data-go="country">${c.name}</span>`;
  }
  if(state.regionId){
    const c = WORLD.find(c=>c.id===state.countryId);
    const r = c.regions.find(r=>r.id===state.regionId);
    html += `<span class="sep">/</span><span class="crumb current" data-go="gallery">${r.name}</span>`;
  }
  breadcrumb.innerHTML = html;
  breadcrumb.classList.toggle('show', state.view!=='world');
  breadcrumb.querySelectorAll('.crumb').forEach(el=>{
    el.addEventListener('click', ()=>{
      const go = el.dataset.go;
      if(go==='world') showWorld();
      else if(go==='country') showCountry(state.countryId);
    });
  });
}

function showWorld(fromEl){
  state = { view:'world', countryId:null, regionId:null };
  $('#galleryView').classList.remove('show');
  if(fromEl) setIrisOriginFromEvent(fromEl);
  fireIris();
  zoomReset();
  clearPins();
  mapSvg.appendChild(pinsLayer);
  renderBreadcrumb();
  $('#hint').textContent = 'hover a highlighted country · click to descend';
}

function showCountry(countryId, fromEl){
  const country = WORLD.find(c=>c.id===countryId);
  state = { view:'country', countryId, regionId:null };
  $('#galleryView').classList.remove('show');
  if(fromEl) setIrisOriginFromEvent(fromEl);
  fireIris();
  clearPins();
  const fit = computeFit(country);
  country.regions.forEach(region=>{
    const p = project(region.lat, region.lng);
    drawPin({ x:p.x, y:p.y, name:region.name, sub:true, counterScale:fit.scale,
      onClick:(el)=>showGallery(countryId, region.id, el) });
  });
  mapSvg.appendChild(pinsLayer);
  setTimeout(()=>zoomTo(fit.lat, fit.lng, fit.scale), 30);
  renderBreadcrumb();
  $('#hint').textContent = `${country.regions.length} location${country.regions.length>1?'s':''} in ${country.name} · click to open`;
}

/* compute a bounding box around all of a country's regions (in viewBox px),
   pick a center + scale that frames them with comfortable padding.
   A single-region country (just one point, zero span) gets a fixed, modest
   zoom rather than racing to the max clamp — that was the old over-zoom bug. */
function computeFit(country){
  const pts = country.regions.map(r=>project(r.lat,r.lng));
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rawSpanX = maxX-minX, rawSpanY = maxY-minY;
  const isSinglePoint = rawSpanX < 0.5 && rawSpanY < 0.5;
  const centerLat = country.regions.reduce((s,r)=>s+r.lat,0)/country.regions.length;
  const centerLng = country.regions.reduce((s,r)=>s+r.lng,0)/country.regions.length;
  if(isSinglePoint){
    return { lat:centerLat, lng:centerLng, scale:6.5 };
  }
  const spanX = Math.max(rawSpanX, 18);
  const spanY = Math.max(rawSpanY, 18);
  const cssW = viewport.clientWidth, cssH = viewport.clientHeight;
  const PAD = 3.0;
  const scaleX = 1000 / (spanX*PAD);
  const scaleY = 500 / (spanY*PAD);
  let scale = Math.min(scaleX, scaleY);
  scale = Math.max(4, Math.min(scale, 14));
  return { lat:centerLat, lng:centerLng, scale };
}

function showGallery(countryId, regionId, fromEl){
  const country = WORLD.find(c=>c.id===countryId);
  const region = country.regions.find(r=>r.id===regionId);
  state = { view:'gallery', countryId, regionId };
  if(fromEl) setIrisOriginFromEvent(fromEl);
  fireIris();
  setTimeout(()=>{
    $('#galleryMeta').textContent = country.name;
    $('#galleryTitle').textContent = region.name;
    const grid = $('#galleryGrid');
    grid.innerHTML='';
    region.photos.forEach(photo=>{
      const fig = document.createElement('figure');
      fig.innerHTML = `<img src="${photo.src}" alt="${photo.cap}" loading="lazy"><figcaption>${photo.cap}</figcaption>`;
      fig.addEventListener('click', ()=>openLightbox(photo));
      grid.appendChild(fig);
    });
    $('#galleryView').classList.add('show');
  }, 250);
  renderBreadcrumb();
}

function openLightbox(photo){
  $('#lbImg').src = photo.src;
  $('#lbImg').alt = photo.cap;
  $('#lbCap').textContent = photo.cap;
  $('#lightbox').classList.add('show');
}
$('#lbClose').addEventListener('click', ()=> $('#lightbox').classList.remove('show'));
$('#lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') $('#lightbox').classList.remove('show'); });
$('#galleryBack').addEventListener('click', ()=> showCountry(state.countryId));

/* coordinate readout on hover, using the real projection */
viewport.addEventListener('mousemove', (e)=>{
  if(!PROJ) return;
  const rect = viewport.getBoundingClientRect();
  const transformScale = mapSvg.style.transform.match(/scale\(([\d.]+)\)/);
  const scale = transformScale ? parseFloat(transformScale[1]) : 1;
  const translateMatch = mapSvg.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
  const tx = translateMatch ? parseFloat(translateMatch[1]) : 0;
  const ty = translateMatch ? parseFloat(translateMatch[2]) : 0;
  const cssW = viewport.clientWidth, cssH = viewport.clientHeight;
  const screenX = e.clientX-rect.left, screenY = e.clientY-rect.top;
  const X = screenX/scale - tx, Y = screenY/scale - ty;
  const vbX = X/cssW*1000, vbY = Y/cssH*500;
  const inv = PROJ.invert([vbX,vbY]);
  if(inv){
    $('#coords').textContent = `LAT ${inv[1].toFixed(1)} / LNG ${inv[0].toFixed(1)}`;
  }
});

/* init */
buildDotPatterns();
loadWorldGeometry().then(showWorld);
</script>
