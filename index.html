<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaditya Photography</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{
    --bg:#F3EEE2;
    --bg-raised:#EAE3D2;
    --paper:#2E2A20;
    --paper-dim:#8A8270;
    --ink:#6E5A3E;
    --ink-dim:#A8957A;
    --rust:#A8492C;
    --line:#DCD4BF;
    --dot:#D2C8B0;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--paper);font-family:var(--font-body);overflow:hidden;height:100%;}
  a{color:inherit;}
  ::selection{background:var(--ink);color:var(--bg);}

  #app{position:relative;width:100vw;height:100vh;overflow:hidden;}

  /* ---------- HEADER ---------- */
  header{
    position:absolute; top:0; left:0; right:0; z-index:30;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:28px 36px; pointer-events:none;
  }
  .wordmark{
    font-family:var(--font-display); font-weight:500; font-size:22px;
    letter-spacing:0.01em; pointer-events:auto;
  }
  .wordmark span{color:var(--ink); font-style:italic; font-weight:400;}
  .thesis{
    max-width:280px; text-align:right; font-size:12px; line-height:1.6;
    color:var(--paper-dim); font-family:var(--font-mono); letter-spacing:0.01em;
    pointer-events:auto;
  }

  /* ---------- BREADCRUMB / BACK ---------- */
  #breadcrumb{
    position:absolute; top:28px; left:50%; transform:translateX(-50%);
    z-index:50; display:flex; gap:10px; align-items:center;
    font-family:var(--font-mono); font-size:12px; color:var(--paper-dim);
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #breadcrumb.show{opacity:1; pointer-events:auto;}
  #breadcrumb .crumb{cursor:pointer; padding:4px 8px; border:1px solid transparent;}
  #breadcrumb .crumb:hover{color:var(--paper); border-color:var(--line);}
  #breadcrumb .crumb.current{color:var(--ink);}
  #breadcrumb .sep{color:var(--line);}

  /* ---------- MAP STAGE ---------- */
  #stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  }
  #mapViewport{
    width:100%; height:100%; position:relative; overflow:hidden; touch-action:none;
  }
  #mapSvg{
    width:100%; height:100%; display:block;
    transform-origin:0 0;
    transition:transform 0.55s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
    shape-rendering:geometricPrecision;
    text-rendering:optimizeLegibility;
  }
  #mapSvg.zooming{ pointer-events:none; }
  #mapSvg.zooming .pin{ cursor:default; }
  .country-path{cursor:pointer; stroke:var(--line); stroke-width:0.6; transition:filter .2s, stroke .25s; vector-effect:non-scaling-stroke;}
  .country-path.active{stroke:var(--ink-dim);}
  .country-path.active:hover{stroke:var(--ink); filter:brightness(0.94) saturate(1.15);}
  .country-path.inactive{fill:var(--bg); stroke:var(--line); cursor:default;}
  .ocean{fill:var(--bg);}

  /* ---------- PINS (real HTML, not scaled by the map's CSS transform —
     this is what keeps labels crisp at any zoom level; text/circles drawn
     inside a scaled SVG get rasterized by the browser's compositor during
     and after the transform, which is what caused the persistent blur) --- */
  #pinsHtml{ position:absolute; inset:0; z-index:20; pointer-events:none; }
  #pinsHtml.zooming{ pointer-events:none; }
  .pinh{
    position:absolute; cursor:pointer; pointer-events:auto;
    transition:left 0.55s cubic-bezier(.22,.61,.36,1), top 0.55s cubic-bezier(.22,.61,.36,1);
  }
  /* dotwrap/leader/lbl are positioned via inline left/top set in JS,
     relative to .pinh's own (0,0) — which IS the exact geo coordinate.
     Only dotwrap is offset by -50% of its own size to center the dot on
     that point; leader + label extend rightward from the dot's edge and
     never affect where the dot itself sits. */
  .pinh .dotwrap{ position:absolute; top:0; }
  .pinh .ring{
    position:absolute; inset:0; border-radius:50%; border:1px solid var(--ink);
    opacity:0; transition:opacity .2s;
  }
  .pinh .core{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    border-radius:50%; background:var(--ink);
    transition:transform .2s;
  }
  .pinh.sub .core{ background:var(--rust); }
  /* leader line — a short connector from dot to label, always drawn, so
     it's unambiguous which pin a label belongs to even when several
     dots sit close together on screen. */
  .pinh .leader{ position:absolute; top:0; transform:translateY(-50%); height:1px; background:var(--line); }
  .pinh .lbl{
    position:absolute; top:0; transform:translateY(-50%);
    font-family:var(--font-mono); font-size:11px; color:var(--paper-dim);
    white-space:nowrap; padding-left:6px;
    opacity:.85; transition:opacity .2s, color .2s;
  }
  .pinh:hover .ring{ opacity:0.55; }
  .pinh:hover .core{ transform:translate(-50%,-50%) scale(1.3); }
  .pinh:hover .leader{ background:var(--ink-dim); }
  .pinh:hover .lbl{ opacity:1; color:var(--paper); }

  /* ---------- APERTURE TRANSITION ---------- */
  #iris{
    position:absolute; inset:0; z-index:25; pointer-events:none;
    background:var(--bg);
    clip-path:circle(0% at 50% 50%);
  }
  #iris.firing{
    animation:irisOpen 0.9s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes irisOpen{
    0%{clip-path:circle(0% at var(--ix,50%) var(--iy,50%));}
    45%{clip-path:circle(75% at var(--ix,50%) var(--iy,50%));}
    100%{clip-path:circle(0% at var(--ix,50%) var(--iy,50%));}
  }

  /* ---------- COORD READOUT ---------- */
  #coords{
    position:absolute; bottom:28px; left:36px; z-index:30;
    font-family:var(--font-mono); font-size:11px; color:var(--paper-dim);
    letter-spacing:0.02em;
  }
  #hint{
    position:absolute; bottom:28px; right:36px; z-index:30;
    font-family:var(--font-mono); font-size:11px; color:var(--paper-dim);
    text-align:right; max-width:240px; line-height:1.6;
  }

  /* ---------- GALLERY VIEW ---------- */
  #galleryView{
    position:absolute; inset:0; z-index:40; background:var(--bg);
    overflow-y:auto; padding:120px 36px 80px; display:none;
  }
  #galleryView.show{display:block;}
  .gallery-head{max-width:900px; margin:0 auto 40px;}
  /* sticky + frosted, same trick as the mobile wordmark pill — the button
     stays pinned near the top of the scrollable gallery and stays legible
     over whatever photo happens to be scrolling underneath it, so there's
     always a fast way back without scrolling all the way up. */
  .back-link{
    position:sticky; top:18px; z-index:5;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font-family:var(--font-mono); font-size:12px; color:var(--paper-dim);
    margin-bottom:18px; transition:color .2s, background .2s;
    padding:8px 14px; margin-left:-14px;
    border-radius:20px;
    background:rgba(243,238,226,0.72);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .back-link:hover{color:var(--ink); background:rgba(243,238,226,0.9);}
  .gallery-head h1{
    font-family:var(--font-display); font-weight:500; font-size:42px; margin:0 0 6px;
  }
  .gallery-head .meta{
    font-family:var(--font-mono); font-size:12px; color:var(--ink); letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .gallery-grid{
    max-width:1100px; margin:0 auto; display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:18px;
  }
  .gallery-grid figure{
    margin:0; cursor:pointer; position:relative; overflow:hidden; background:var(--bg-raised);
  }
  .gallery-grid img{width:100%; display:block; aspect-ratio:4/5; object-fit:cover; transition:transform .5s; filter:grayscale(0.1) contrast(1.05);}
  .gallery-grid figure:hover img{transform:scale(1.04);}
  .gallery-grid img.flip{transform:rotate(180deg);}
  .gallery-grid figure:hover img.flip{transform:rotate(180deg) scale(1.04);}
  #lbImg.flip{transform:rotate(180deg);}
  .gallery-grid figcaption{
    position:absolute; bottom:0; left:0; right:0; padding:14px;
    font-family:var(--font-mono); font-size:11px; color:var(--paper);
    background:linear-gradient(transparent, rgba(0,0,0,.65));
  }

  /* ---------- LIGHTBOX ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:90; background:rgba(10,10,8,.94);
    display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  #lightbox.show{display:flex;}
  #lightbox img{max-width:88vw; max-height:78vh; object-fit:contain;}
  #lightbox .lb-cap{font-family:var(--font-mono); font-size:12px; color:var(--paper-dim); margin-top:16px;}
  #lightbox .lb-close{position:absolute; top:28px; right:36px; font-family:var(--font-mono); font-size:12px; cursor:pointer; color:var(--paper-dim);}
  #lightbox .lb-close:hover{color:var(--paper);}
  #lightbox .lb-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    font-family:var(--font-display); font-size:48px; line-height:1; font-weight:300;
    color:var(--paper-dim); cursor:pointer; padding:12px 18px; user-select:none;
    transition:color .2s;
  }
  #lightbox .lb-arrow:hover{color:var(--paper);}
  #lightbox .lb-prev{left:8px;}
  #lightbox .lb-next{right:8px;}
  @media (max-width:640px){
    #lightbox .lb-arrow{font-size:34px; padding:8px 10px;}
  }

  @media (max-width:640px){
    .thesis{display:none;}
    .gallery-head h1{font-size:30px;}
    #hint{display:none;}
  }

  /* ---------- MOBILE DIRECTORY (replaces the pan/zoom map below ~780px) ----------
     Same tokens/fonts/colors as the desktop map view, just a tap-through,
     scrollable list instead of a spatial explorer — small screens don't have
     room for precise pin-tapping or trackpad-style pinch gestures. The map's
     code path is untouched; this is an additive alternate view swapped in by
     JS via the .mobile-mode class on <body>. */
  #mobileNav{
    display:none; position:absolute; inset:0; z-index:10;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:104px 20px 70px;
  }
  body.mobile-mode #mobileNav{display:block;}
  body.mobile-mode #stage,
  body.mobile-mode #coords,
  body.mobile-mode #hint,
  body.mobile-mode #breadcrumb{display:none !important;}

  .mnav-head{margin-bottom:22px;}
  .mnav-title{font-family:var(--font-display); font-weight:500; font-size:28px;}
  .mnav-sub{font-family:var(--font-mono); font-size:11px; color:var(--paper-dim); margin-top:6px; letter-spacing:.02em;}

  details.mnav-branch{border-bottom:1px solid var(--line);}
  details.mnav-branch > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:15px 2px; font-family:var(--font-display); font-size:17px; font-weight:500;
    -webkit-tap-highlight-color:transparent;
  }
  details.mnav-branch > summary::-webkit-details-marker{display:none;}
  details.mnav-branch > summary::after{
    content:'+'; margin-left:auto; color:var(--paper-dim); font-family:var(--font-mono); font-size:16px;
  }
  details.mnav-branch[open] > summary::after{content:'–';}
  .mnav-swatch{width:9px; height:9px; border-radius:50%; flex:none;}
  .mnav-children{padding-left:14px;}
  .mnav-children .mnav-branch summary{font-size:15px; font-weight:400;}

  .mnav-leaf{
    display:flex; align-items:center; gap:12px; padding:11px 2px; cursor:pointer;
    border-bottom:1px solid var(--line); -webkit-tap-highlight-color:transparent;
  }
  .mnav-thumb{width:50px; height:50px; object-fit:cover; border-radius:4px; flex:none; background:var(--bg-raised);}
  .mnav-leaf-info{min-width:0;}
  .mnav-leaf-name{font-family:var(--font-body); font-size:14.5px; color:var(--paper);}
  .mnav-leaf-count{font-family:var(--font-mono); font-size:11px; color:var(--paper-dim); margin-top:2px;}
  .mnav-arrow{margin-left:auto; color:var(--ink); font-size:15px; flex:none;}

  @media (max-width:640px){
    #mobileNav{padding:96px 18px 60px;}
    .mnav-title{font-size:24px;}
  }

  /* soft frosted pill behind the wordmark on mobile, so it stays legible
     scrolling over photo thumbnails/varied backgrounds beneath it */
  body.mobile-mode .wordmark{
    display:inline-block; padding:7px 14px; margin:-7px -14px;
    border-radius:20px;
    background:rgba(243,238,226,0.62);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }

  /* per-country outline icon in the mobile list, traced from real border
     geometry and filled with that country's map color — same color cue
     as the desktop map's fill, just shrunk to an icon. */
  .mnav-flag{width:26px; height:19px; flex:none; display:block;}
  .mnav-flag path{stroke:var(--paper); stroke-width:0.4; stroke-opacity:.25;}
  .mnav-swatch{width:9px; height:9px; border-radius:50%; flex:none;} /* fallback if a border trace fails to load */

  /* branch rows (things that expand further) get a small "N collections"
     line, mirroring the leaf rows' "N photos" — same visual language, so
     it reads as "there's more inside" rather than a dead-end label. */
  .mnav-branch-info{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .mnav-count{font-family:var(--font-mono); font-size:10.5px; color:var(--paper-dim); font-weight:400; letter-spacing:.01em;}
  .mnav-loading{font-family:var(--font-mono); font-size:12px; color:var(--paper-dim); padding:20px 2px;}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="wordmark">Aaditya's <span>Atlas</span></div>
    <div class="thesis">a photographic record of aadi's "canon rebel" journey.</div>
  </header>

  <div id="breadcrumb">
    <span class="crumb" data-go="world">world</span>
  </div>

  <div id="stage">
    <div id="mapViewport">
      <svg id="mapSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="pinsHtml"></div>
    </div>
  </div>

  <div id="mobileNav"></div>

  <div id="iris"></div>

  <div id="coords">LAT — / LNG —</div>
  <div id="hint">hover a marker to preview · click to descend</div>

  <div id="galleryView">
    <div class="gallery-head">
      <div class="back-link" id="galleryBack">← back</div>
      <div class="meta" id="galleryMeta">region</div>
      <h1 id="galleryTitle">Title</h1>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <div id="lightbox">
    <span class="lb-close" id="lbClose">close ✕</span>
    <span class="lb-arrow lb-prev" id="lbPrev">‹</span>
    <img id="lbImg" src="" alt="">
    <span class="lb-arrow lb-next" id="lbNext">›</span>
    <div class="lb-cap" id="lbCap"></div>
  </div>
</div>

/* ============== HELPERS ============== */
const $ = sel => document.querySelector(sel);
const svgNS = 'http://www.w3.org/2000/svg';
const mapSvg = $('#mapSvg');
const viewport = $('#mapViewport');
const iris = $('#iris');
const breadcrumb = $('#breadcrumb');

function project(lat,lng){ return PROJ([lng,lat]) ? {x:PROJ([lng,lat])[0], y:PROJ([lng,lat])[1]} : {x:0,y:0}; }

/* Flat solid fills, no dot texture: active countries get their pastel
   color, everything else (ocean + countries with no data yet) just
   matches the page background so only the visited places stand out. */
function buildDotPatterns(){
  const oceanRect = document.createElementNS(svgNS,'rect');
  oceanRect.setAttribute('class','ocean');
  oceanRect.setAttribute('x','0'); oceanRect.setAttribute('y','0');
  oceanRect.setAttribute('width','1000'); oceanRect.setAttribute('height','500');
  mapSvg.appendChild(oceanRect);
}

let PROJ = null;
const countryLayer = document.createElementNS(svgNS,'g');
countryLayer.setAttribute('id','countryLayer');

async function loadWorldGeometry(){
  const topoUrl = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json';
  const topo = await fetch(topoUrl).then(r=>r.json());
  const geo = topojson.feature(topo, topo.objects.countries);
  PROJ = d3.geoNaturalEarth1().fitSize([1000,500], geo);
  const path = d3.geoPath().projection(PROJ);
  const activeIsoSet = new Set(WORLD.map(c=>c.iso));

  geo.features.forEach(feature=>{
    const iso = +feature.id;
    const p = document.createElementNS(svgNS,'path');
    p.setAttribute('d', path(feature));
    const isActive = activeIsoSet.has(iso);
    p.setAttribute('class', 'country-path ' + (isActive?'active':'inactive'));
    if(isActive){
      const country = WORLD.find(c=>c.iso===iso);
      p.style.fill = country.color;
      p.addEventListener('click', (e)=> navigateTo([country.id], p));
    }
    countryLayer.appendChild(p);
  });
  mapSvg.appendChild(countryLayer);
}

const pinsHtmlEl = $('#pinsHtml');
let activePins = []; // {lat,lng,el}

function clearPinsHtml(){ pinsHtmlEl.innerHTML=''; activePins = []; }

/* total photo count beneath a node — used to size pins so major hubs
   (lots of regions/photos) read as visually more important than a
   single-gallery stop. */
function getWeight(node){
  if(node.photos) return node.photos.length;
  return node.regions.reduce((sum,child)=>sum+getWeight(child), 0);
}
function sizeMultiplierFor(node){
  const w = getWeight(node);
  return Math.max(1, Math.min(1 + Math.log2(Math.max(w,1))/3, 2.2));
}

/* Convert a lat/lng into an on-screen pixel position given the map's
   current CSS transform (scale + translate). Deriving this directly from
   the same scale/translate values applied to #mapSvg keeps pins locked to
   their geographic position while being plain, crisply-rendered HTML —
   no compositor rasterization, no blur, at any zoom level. */
function projectToScreen(lat,lng){
  const r = getMapRenderRect();
  const p = project(lat,lng);
  const Px = r.offsetX + p.x/1000*r.width;
  const Py = r.offsetY + p.y/500*r.height;
  /* rounding to whole pixels matters here — a label sitting at a
     fractional pixel position (e.g. left:214.6px) forces the browser to
     antialias/subpixel-render the text, which reads as permanently
     "slightly blurry" even with nothing animating. */
  return { x: Math.round(viewT.s*(Px+viewT.tx)), y: Math.round(viewT.s*(Py+viewT.ty)) };
}

function repositionPinsHtml(){
  activePins.forEach(pin=>{
    const {x,y} = projectToScreen(pin.lat, pin.lng);
    pin.el.style.left = x+'px';
    pin.el.style.top = y+'px';
  });
}

function addPinHtml({lat,lng,name,sub,onClick,sizeMultiplier=1}){
  const el = document.createElement('div');
  el.className = 'pinh'+(sub?' sub':'');

  const dotSize = 18*sizeMultiplier;
  const coreSize = 7*sizeMultiplier;
  const leaderW = 13;

  const dotwrap = document.createElement('div');
  dotwrap.className = 'dotwrap';
  dotwrap.style.width = dotSize+'px';
  dotwrap.style.height = dotSize+'px';
  dotwrap.style.left = (-dotSize/2)+'px'; // centers the dot exactly on (0,0), i.e. the geo point
  dotwrap.style.top = (-dotSize/2)+'px';  // (vertical centering — was missing, which is why dots sat below their lines)
  const ring = document.createElement('span'); ring.className='ring';
  const core = document.createElement('span'); core.className='core';
  core.style.width = coreSize+'px';
  core.style.height = coreSize+'px';
  dotwrap.appendChild(ring); dotwrap.appendChild(core);

  const leader = document.createElement('span');
  leader.className = 'leader';
  leader.style.left = (dotSize/2)+'px'; // starts right at the dot's edge, not affected by dot centering
  leader.style.width = leaderW+'px';

  const lbl = document.createElement('span');
  lbl.className = 'lbl';
  lbl.style.left = (dotSize/2 + leaderW)+'px';
  lbl.style.fontSize = `${11*Math.min(sizeMultiplier,1.3)}px`;
  lbl.textContent = name;

  el.appendChild(dotwrap); el.appendChild(leader); el.appendChild(lbl);
  el.addEventListener('click', (e)=>{ e.stopPropagation(); onClick(el); });
  pinsHtmlEl.appendChild(el);

  const pinData = { lat, lng, el };
  activePins.push(pinData);
  const {x,y} = projectToScreen(lat,lng);
  el.style.left = x+'px'; el.style.top = y+'px';
  return el;
}

/* ============== STATE / VIEWS ============== */
let state = { path: [] };

function setIrisOriginFromEvent(el){
  const rect = el.getBoundingClientRect();
  const cx = ((rect.left+rect.width/2)/window.innerWidth*100).toFixed(1)+'%';
  const cy = ((rect.top+rect.height/2)/window.innerHeight*100).toFixed(1)+'%';
  iris.style.setProperty('--ix',cx);
  iris.style.setProperty('--iy',cy);
}
function fireIris(){
  iris.classList.remove('firing');
  void iris.offsetWidth;
  iris.classList.add('firing');
}

/* With preserveAspectRatio="meet", the map content doesn't necessarily
   fill the whole viewport box — on narrow/tall screens it's centered with
   empty space above/below (or left/right on very wide screens). This
   computes the actual rendered size + offset of the map content itself,
   so zoom targeting and the coordinate readout stay accurate everywhere. */
function getMapRenderRect(){
  const cssW = viewport.clientWidth, cssH = viewport.clientHeight;
  const viewBoxAspect = 1000/500;
  const containerAspect = cssW/cssH;
  let width, height, offsetX=0, offsetY=0;
  if(containerAspect > viewBoxAspect){
    height = cssH;
    width = height*viewBoxAspect;
    offsetX = (cssW-width)/2;
  } else {
    width = cssW;
    height = width/viewBoxAspect;
    offsetY = (cssH-height)/2;
  }
  return { width, height, offsetX, offsetY, cssW, cssH };
}

let viewT = { s:1, tx:0, ty:0 };
let zoomSettleTimer = null;
function lockDuringZoom(){
  mapSvg.classList.add('zooming');
  pinsHtmlEl.classList.add('zooming');
  clearTimeout(zoomSettleTimer);
  zoomSettleTimer = setTimeout(()=>{
    mapSvg.classList.remove('zooming');
    pinsHtmlEl.classList.remove('zooming');
  }, 600);
}
function zoomTo(lat,lng,scale){
  const r = getMapRenderRect();
  const p = project(lat,lng);
  const X = r.offsetX + p.x/1000*r.width;
  const Y = r.offsetY + p.y/500*r.height;
  const tx = (r.cssW/2)/scale - X;
  const ty = (r.cssH/2)/scale - Y;
  lockDuringZoom();
  mapSvg.style.transform = `scale(${scale}) translate(${tx}px, ${ty}px)`;
  viewT = { s:scale, tx, ty };
  repositionPinsHtml();
}
function zoomReset(){
  lockDuringZoom();
  mapSvg.style.transform = 'scale(1) translate(0px,0px)';
  viewT = { s:1, tx:0, ty:0 };
  repositionPinsHtml();
}

/* ---------- Trackpad pinch-zoom / two-finger pan ----------
   Browsers report a trackpad pinch gesture as a wheel event with
   ctrlKey=true (this is the same convention Google Maps, Mapbox, etc.
   rely on) — deltaY carries the zoom amount. A plain two-finger scroll
   (no ctrlKey) is a pan. This layers on top of the existing click-to-
   navigate system: scrolling just lets you look around freely without
   changing which breadcrumb level you're "in". */
const MIN_SCALE = 1, MAX_SCALE = 40;
let wheelIdleTimer = null;

function applyViewT(){
  mapSvg.style.transform = `scale(${viewT.s}) translate(${viewT.tx}px, ${viewT.ty}px)`;
  repositionPinsHtml();
}

viewport.addEventListener('wheel', (e)=>{
  e.preventDefault();
  /* while actively scrolling, drop the CSS transition so the map tracks
     the gesture 1:1 instead of lagging behind through a .55s ease —
     restored once the gesture stops so click-navigation keeps its
     smooth animated zoom. */
  mapSvg.style.transition = 'none';
  clearTimeout(wheelIdleTimer);
  wheelIdleTimer = setTimeout(()=>{ mapSvg.style.transition = ''; }, 150);

  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;

  if(e.ctrlKey){
    const factor = Math.exp(-e.deltaY * 0.012);
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, viewT.s*factor));
    const worldX = cx/viewT.s - viewT.tx, worldY = cy/viewT.s - viewT.ty;
    viewT.tx = cx/newScale - worldX;
    viewT.ty = cy/newScale - worldY;
    viewT.s = newScale;
  } else {
    viewT.tx -= e.deltaX/viewT.s;
    viewT.ty -= e.deltaY/viewT.s;
  }
  applyViewT();
}, { passive:false });

/* ---- generic tree helpers ----
   A node is either a "branch" (has .regions, e.g. a country or a state/area
   grouping) or a "leaf" (has .photos, a city/gallery). path is an array of
   ids from the top of WORLD down to the current node. */
function getNode(path){
  let node = WORLD.find(c=>c.id===path[0]);
  for(let i=1;i<path.length;i++){ node = node.regions.find(r=>r.id===path[i]); }
  return node;
}
function getNodeName(path){ return getNode(path).name; }

function renderBreadcrumb(){
  let html = `<span class="crumb ${state.path.length===0?'current':''}" data-depth="0">world</span>`;
  for(let i=0;i<state.path.length;i++){
    const subPath = state.path.slice(0,i+1);
    const node = getNode(subPath);
    const isCurrent = (i === state.path.length-1);
    html += `<span class="sep">/</span><span class="crumb ${isCurrent?'current':''}" data-depth="${i+1}">${node.name}</span>`;
  }
  breadcrumb.innerHTML = html;
  breadcrumb.classList.toggle('show', state.path.length>0);
  breadcrumb.querySelectorAll('.crumb').forEach(el=>{
    el.addEventListener('click', ()=>{
      const depth = +el.dataset.depth;
      navigateTo(state.path.slice(0, depth));
    });
  });
}

/* the single entry point for moving to any place in the hierarchy.
   path=[] is the world view. A path ending on a leaf node (has .photos)
   opens the gallery; otherwise it shows that node's children as pins. */
function navigateTo(path, fromEl){
  if(path.length===0){ showWorld(fromEl); return; }
  const node = getNode(path);
  if(node.photos){ showGallery(path, fromEl); }
  else { showBranch(path, fromEl); }
}

function showWorld(fromEl){
  state = { path: [] };
  $('#galleryView').classList.remove('show');
  if(fromEl) setIrisOriginFromEvent(fromEl);
  fireIris();
  zoomReset();
  clearPinsHtml();
  renderBreadcrumb();
  $('#hint').textContent = 'hover a highlighted country · click to descend';
}

function showBranch(path, fromEl){
  const node = getNode(path);
  state = { path };
  $('#galleryView').classList.remove('show');
  if(fromEl) setIrisOriginFromEvent(fromEl);
  fireIris();
  clearPinsHtml();
  const fit = computeFit(node);
  node.regions.forEach(child=>{
    addPinHtml({ lat:child.lat, lng:child.lng, name:child.name, sub:true,
      sizeMultiplier:sizeMultiplierFor(child),
      onClick:(el)=>navigateTo([...path, child.id], el) });
  });
  setTimeout(()=>zoomTo(fit.lat, fit.lng, fit.scale), 30);
  renderBreadcrumb();
  $('#hint').textContent = `${node.regions.length} location${node.regions.length>1?'s':''} in ${node.name} · click to open`;
}

/* compute a bounding box around a branch node's children (in viewBox px),
   pick a center + scale that frames them with comfortable padding.
   A single-child branch (just one point, zero span) gets a fixed, modest
   zoom rather than racing to the max clamp. */
function computeFit(node){
  const children = node.regions;
  const pts = children.map(r=>project(r.lat,r.lng));
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rawSpanX = maxX-minX, rawSpanY = maxY-minY;
  const isSinglePoint = rawSpanX < 0.5 && rawSpanY < 0.5;
  const centerLat = children.reduce((s,r)=>s+r.lat,0)/children.length;
  const centerLng = children.reduce((s,r)=>s+r.lng,0)/children.length;
  if(isSinglePoint){
    return { lat:centerLat, lng:centerLng, scale:6.5 };
  }
  const spanX = Math.max(rawSpanX, 18);
  const spanY = Math.max(rawSpanY, 18);
  const PAD = 3.0;
  const scaleX = 1000 / (spanX*PAD);
  const scaleY = 500 / (spanY*PAD);
  let scale = Math.min(scaleX, scaleY);
  scale = Math.max(4, Math.min(scale, 14));
  return { lat:centerLat, lng:centerLng, scale };
}

function showGallery(path, fromEl){
  const leaf = getNode(path);
  const parentPath = path.slice(0,-1);
  state = { path };
  if(fromEl) setIrisOriginFromEvent(fromEl);
  fireIris();
  setTimeout(()=>{
    $('#galleryMeta').textContent = parentPath.length ? getNodeName(parentPath) : '';
    $('#galleryTitle').textContent = leaf.name;
    const grid = $('#galleryGrid');
    grid.innerHTML='';
    leaf.photos.forEach((photo,i)=>{
      const fig = document.createElement('figure');
      fig.innerHTML = `<img src="${photo.src}" alt="${photo.cap}" loading="lazy"${photo.flip?' class="flip"':''}><figcaption>${photo.cap}</figcaption>`;
      fig.addEventListener('click', ()=>openLightbox(leaf.photos, i));
      grid.appendChild(fig);
    });
    $('#galleryView').classList.add('show');
  }, 250);
  renderBreadcrumb();
}

/* lightbox now tracks the current gallery's full photo list + index,
   so prev/next (and arrow keys) can step through without closing. */
let lbPhotos = [];
let lbIndex = 0;

function openLightbox(photos, index){
  lbPhotos = photos;
  lbIndex = index;
  renderLightboxPhoto();
  $('#lightbox').classList.add('show');
}
function renderLightboxPhoto(){
  const photo = lbPhotos[lbIndex];
  $('#lbImg').src = photo.src;
  $('#lbImg').alt = photo.cap;
  $('#lbCap').textContent = photo.cap;
  $('#lbImg').classList.toggle('flip', !!photo.flip);
  const multiple = lbPhotos.length > 1;
  $('#lbPrev').style.display = multiple ? 'block' : 'none';
  $('#lbNext').style.display = multiple ? 'block' : 'none';
}
function lbStep(delta){
  if(lbPhotos.length < 2) return;
  lbIndex = (lbIndex + delta + lbPhotos.length) % lbPhotos.length;
  renderLightboxPhoto();
}
$('#lbPrev').addEventListener('click', (e)=>{ e.stopPropagation(); lbStep(-1); });
$('#lbNext').addEventListener('click', (e)=>{ e.stopPropagation(); lbStep(1); });
$('#lbClose').addEventListener('click', ()=> $('#lightbox').classList.remove('show'));
$('#lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') $('#lightbox').classList.remove('show'); });
document.addEventListener('keydown', (e)=>{
  if(!$('#lightbox').classList.contains('show')) return;
  if(e.key==='ArrowLeft') lbStep(-1);
  else if(e.key==='ArrowRight') lbStep(1);
  else if(e.key==='Escape') $('#lightbox').classList.remove('show');
});
$('#galleryBack').addEventListener('click', ()=>{
  if(document.body.classList.contains('mobile-mode')){
    /* mobile has no map underneath to zoom back out on — the directory
       list is already sitting there, so just drop the gallery overlay. */
    $('#galleryView').classList.remove('show');
    state = { path: state.path.slice(0,-1) };
  } else {
    navigateTo(state.path.slice(0,-1));
  }
});

/* coordinate readout on hover, using the real projection */
viewport.addEventListener('mousemove', (e)=>{
  if(!PROJ) return;
  const rect = viewport.getBoundingClientRect();
  const transformScale = mapSvg.style.transform.match(/scale\(([\d.]+)\)/);
  const scale = transformScale ? parseFloat(transformScale[1]) : 1;
  const translateMatch = mapSvg.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
  const tx = translateMatch ? parseFloat(translateMatch[1]) : 0;
  const ty = translateMatch ? parseFloat(translateMatch[2]) : 0;
  const r = getMapRenderRect();
  const screenX = e.clientX-rect.left, screenY = e.clientY-rect.top;
  const X = screenX/scale - tx, Y = screenY/scale - ty;
  const vbX = (X - r.offsetX)/r.width*1000, vbY = (Y - r.offsetY)/r.height*500;
  const inv = PROJ.invert([vbX,vbY]);
  if(inv){
    $('#coords').textContent = `LAT ${inv[1].toFixed(1)} / LNG ${inv[0].toFixed(1)}`;
  }
});

window.addEventListener('resize', ()=> repositionPinsHtml());

/* ============== MOBILE DIRECTORY ==============
   Below the breakpoint, swap the pan/zoom map for a scrollable tap-through
   list built from the exact same WORLD tree — countries and regions become
   nested <details> accordions, and leaf nodes (galleries) become tappable
   rows that open through the existing showGallery()/openLightbox() code,
   so the gallery and lightbox behave identically on both views. The map's
   topojson is never fetched on mobile, which also keeps first load light. */
const MOBILE_QUERY = window.matchMedia('(max-width:780px)');
let mapLoaded = false, mobileNavBuilt = false;

function ensureMapLoaded(){
  if(mapLoaded) return;
  mapLoaded = true;
  buildDotPatterns();
  loadWorldGeometry().then(showWorld);
}

/* how many sub-collections a branch has (its direct children) — shown
   under the name so a tap-worthy folder reads differently from a leaf. */
function countCollections(node){ return node.regions.length; }

function renderNodeMobile(node, path, countryIcons){
  if(node.photos){
    const thumb = node.photos[0].src;
    return `<div class="mnav-leaf" data-path="${path.join('|')}">
      <img class="mnav-thumb" src="${thumb}" alt="" loading="lazy">
      <div class="mnav-leaf-info">
        <div class="mnav-leaf-name">${node.name}</div>
        <div class="mnav-leaf-count">${node.photos.length} photo${node.photos.length>1?'s':''}</div>
      </div>
      <span class="mnav-arrow">→</span>
    </div>`;
  }
  const kids = node.regions.map(child=>renderNodeMobile(child, [...path, child.id], countryIcons)).join('');
  const isCountry = !!node.iso;
  const icon = isCountry && countryIcons[node.id]
    ? countryIcons[node.id]
    : (node.color ? `<span class="mnav-swatch" style="background:${node.color}"></span>` : '');
  const n = countCollections(node);
  return `<details class="mnav-branch"><summary>${icon}
    <div class="mnav-branch-info">
      <span class="mnav-name">${node.name}</span>
      <span class="mnav-count">${n} collection${n>1?'s':''}</span>
    </div>
    </summary>
    <div class="mnav-children">${kids}</div></details>`;
}

let mobileNavBuilding = null;
async function buildMobileNav(){
  if(mobileNavBuilt || mobileNavBuilding) return mobileNavBuilding;
  const root = $('#mobileNav');
  mobileNavBuilding = (async ()=>{
    root.innerHTML = `<div class="mnav-head">
        <div class="mnav-title">Where to?</div>
        <div class="mnav-sub">tap a country, then a place, to open its gallery</div>
      </div><div class="mnav-loading">Loading places…</div>`;

    /* trace each active country's real border from a lightweight (110m,
       icon-scale) world atlas — a separate, much smaller fetch than the
       desktop map's 50m file, so mobile's first load stays light even
       though it now draws little border icons too. */
    let countryIcons = {};
    try{
      const topo = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json());
      const geo = topojson.feature(topo, topo.objects.countries);
      WORLD.forEach(c=>{
        const feature = geo.features.find(f=>+f.id===c.iso);
        if(!feature) return;
        const proj = d3.geoMercator().fitSize([26,19], feature);
        const d = d3.geoPath().projection(proj)(feature);
        if(d) countryIcons[c.id] = `<svg class="mnav-flag" viewBox="0 0 26 19" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="${d}" fill="${c.color}"/></svg>`;
      });
    }catch(e){ /* offline or blocked — falls back to plain color dots below */ }

    root.innerHTML = `<div class="mnav-head">
        <div class="mnav-title">Where to?</div>
        <div class="mnav-sub">tap a country, then a place, to open its gallery</div>
      </div>` + WORLD.map(c=>renderNodeMobile(c, [c.id], countryIcons)).join('');
    root.addEventListener('click', (e)=>{
      const leaf = e.target.closest('.mnav-leaf');
      if(!leaf) return;
      navigateTo(leaf.dataset.path.split('|'), leaf);
    });
    mobileNavBuilt = true;
  })();
  return mobileNavBuilding;
}

function applyMode(){
  const mobile = MOBILE_QUERY.matches;
  document.body.classList.toggle('mobile-mode', mobile);
  if(mobile) buildMobileNav();
  else ensureMapLoaded();
}
MOBILE_QUERY.addEventListener('change', applyMode);

/* init */
applyMode();
</script>
</body>
